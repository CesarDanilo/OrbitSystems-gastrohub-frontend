# Serves the SPA and proxies the API on the same origin (first-party session cookie).
#
# Security headers live at server level only. nginx drops every inherited add_header in a
# location that declares its own, so locations below set caching with `expires` (not add_header)
# to keep CSP, frame and sniffing protection on every response (SEC-01).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # HSTS is sent by the TLS terminator (load balancer/CDN) in front of this container; this
  # server only speaks plain HTTP inside the private network. See docs/deployment/README.md.

  # Server-Sent Events: no buffering, long-lived connection.
  location = /api/admin/stream {
    proxy_pass http://api:3340;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3340;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /uploads/ {
    proxy_pass http://api:3340;
    expires 365d;
  }

  # Hashed build assets never change.
  location /assets/ {
    expires max;
  }

  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
